[package]
name = "window-stream-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "OS adapters for window-stream: window enumeration, per-window capture and input injection behind common traits. macOS via ScreenCaptureKit + CGEvent; stub backend elsewhere."

[dependencies]
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-graphics = { version = "0.25", features = ["highsierra"] }
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFString"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer"] }
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSArray", "NSObject"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCError", "SCShareableContent", "SCStream"] }

[dev-dependencies]

[[bin]]
name = "platform_probe"
path = "src/bin/platform_probe.rs"
