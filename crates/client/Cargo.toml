[package]
name = "window-stream-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "window-stream client: wgpu compositing of per-window I420 textures, demo mode, local window management and input capture"

[dependencies]
winit = "0.30"
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
