name: platform-mac

# macOS (Apple Silicon) verification for crates/platform.
# Builds and tests the platform crate natively on a macOS arm64
# runner and uploads the platform_probe sample binary so it can be
# run on a real Mac without building there.

on:
  push:
    branches:
      - track/platform-mac-ci
    paths:
      - "crates/platform/**"
      - ".github/workflows/platform-mac.yml"
  workflow_dispatch:

jobs:
  build-test:
    name: Build + test crates/platform (macOS arm64)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          uname -m
          xcode-select -p || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build crates/platform
        run: cargo build -p window-stream-platform --all-targets --verbose

      - name: Test crates/platform
        run: cargo test -p window-stream-platform --verbose

      - name: Build platform_probe binary
        run: cargo build -p window-stream-platform --bin platform_probe

      - name: Inspect platform_probe binary
        run: |
          ls -lh target/debug/platform_probe
          file target/debug/platform_probe

      - name: Upload platform_probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform_probe-macos-arm64
          path: target/debug/platform_probe
          if-no-files-found: error
