name: Android Viewer

# The viewer is a separate app (android-viewer/) from the host
# (android/): its own package, its own Gradle project, and a Rust
# cdylib that path-depends on the shared crates — so this workflow
# also triggers on changes to the crates the viewer links.

on:
  push:
    branches:
      - track/android-viewer
      - main
    paths:
      - "android-viewer/**"
      - "crates/client/**"
      - "crates/proto/**"
      - "crates/transport/**"
      - "crates/codec/**"
      - ".github/workflows/android-viewer.yml"
  pull_request:
    paths:
      - "android-viewer/**"
      - "crates/client/**"
      - "crates/proto/**"
      - "crates/transport/**"
      - "crates/codec/**"
      - ".github/workflows/android-viewer.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Android viewer APK (libvpx + Rust core + Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same SDK approach as the host workflow (android.yml):
      # setup-android v3 fails on current cmdline-tools.
      - name: Install Android platform and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # protoc: the proto crate's prost-build step.
      # libclang-dev: the codec crate's bindgen step.
      # pkg-config: the codec crate locates libvpx through it.
      # yasm: libvpx's x86 assembly is NASM-format; its configure
      # auto-detects yasm/nasm when AS is unset (the build script
      # leaves AS unset for the x86_64 ABI only).
      - name: Install protoc, libclang, pkg-config and yasm
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev pkg-config yasm
          LIBCLANG_DIR="$(dirname "$(find /usr/lib -name 'libclang.so' -print -quit)")"
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          echo "libclang at $LIBCLANG_DIR"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android-viewer/rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # The codec crate links libvpx via pkg-config; build one static
      # PIC libvpx per ABI and point the per-target PKG_CONFIG_PATH at
      # it (the pkg-config crate honours PKG_CONFIG_PATH_<target>).
      - name: Build libvpx for Android ABIs
        run: |
          chmod +x android-viewer/scripts/build-libvpx.sh
          android-viewer/scripts/build-libvpx.sh "$ANDROID_NDK_HOME" "$GITHUB_WORKSPACE/.libvpx" v1.14.1

      - name: Build Rust viewer core with cargo-ndk
        working-directory: android-viewer/rust
        env:
          # The pkg-config crate refuses cross probes without this.
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH_aarch64_linux_android: ${{ github.workspace }}/.libvpx/arm64-v8a/lib/pkgconfig
          PKG_CONFIG_PATH_armv7_linux_androideabi: ${{ github.workspace }}/.libvpx/armeabi-v7a/lib/pkgconfig
          PKG_CONFIG_PATH_x86_64_linux_android: ${{ github.workspace }}/.libvpx/x86_64/lib/pkgconfig
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build --release --locked
          find ../app/src/main/jniLibs -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-viewer
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK (package, version, signature)
        run: |
          APK=android-viewer/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | head -5
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: window-stream-android-viewer-debug
          path: android-viewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
