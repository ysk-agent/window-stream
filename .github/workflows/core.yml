name: core

# Core track (proto / transport / dummy) build + tests.
# The integration test needs UDP loopback, which some sandboxes block;
# GitHub-hosted runners provide it, so this workflow is the reference
# verification for the Hello -> Window -> Frame -> FrameAck round trip.

on:
  push:
  pull_request:

jobs:
  cargo-test:
    # Pinned to 24.04: its libvpx is 1.14, the version crates/codec's
    # bindgen-generated FFI was developed and verified against.
    # ubuntu-latest (26.04) ships libvpx 1.16, whose codec config
    # structs no longer match the codec crate's field usage.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (for prost-build) and libvpx headers (for codec)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libvpx-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace -- --nocapture
