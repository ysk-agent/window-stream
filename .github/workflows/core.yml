name: core

# Core track (proto / transport / dummy) build + tests.
# The integration test needs UDP loopback, which some sandboxes block;
# GitHub-hosted runners provide it, so this workflow is the reference
# verification for the Hello -> Window -> Frame -> FrameAck round trip.

on:
  push:
  pull_request:

jobs:
  cargo-test:
    # Correction to the diagnosis in b088fe0 ("pin to ubuntu-24.04"):
    # the Ubuntu 26.04 failure was NOT a libvpx 1.16 layout change.
    # vpx_codec_enc_cfg / vpx_codec_dec_cfg are byte-identical between
    # libvpx 1.14 and 1.16 (enc_cfg is 504 bytes in both). The real
    # cause was bindgen 0.71.1 x libclang 22: LLVM 22 changed
    # clang_getTypeDeclaration() so bindgen silently emitted the cfg
    # structs as opaque types, and every field access failed (E0609).
    # Fixed by bindgen 0.72.1; layout tripwires live in
    # crates/codec/build.rs and crates/codec/src/sys.rs. Full write-up:
    # the libvpx-1.16 investigation report (2026-11-23). No pin needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (for prost-build) and libvpx headers (for codec)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libvpx-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace -- --nocapture
