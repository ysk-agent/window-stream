[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/transport",
    "crates/dummy",
    "crates/codec",
    "crates/client",
    "crates/platform",
    "crates/e2e",
    "crates/perf",
]
# The Android Rust core stays a standalone crate: cargo-ndk builds it on its
# own (with its own lockfile) from the GitHub Actions Android workflow.
exclude = ["android/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
prost = "0.13"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wtransport = { version = "0.6", features = ["dangerous-configuration"] }
rcgen = "0.13"
